{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h1>Iniciar sesión</h1>
    <form method="post" class="mt-3">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
