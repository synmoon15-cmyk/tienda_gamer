{% extends 'base.html' %}
{% block content %}
<h1>{{ object.titulo }}</h1>
<ul class="list-group mt-3">
  <li class="list-group-item"><strong>Plataforma:</strong> {{ object.plataforma }}</li>
  <li class="list-group-item"><strong>Precio:</strong> ${{ object.precio }}</li>
  <li class="list-group-item"><strong>Lanzamiento:</strong> {{ object.fecha_lanzamiento|date:"d/m/Y" }}</li>
  <li class="list-group-item"><strong>Disponible:</strong> {{ object.disponible|yesno:"Sí,No" }}</li>
</ul>
<a href="{% url 'lista' %}" class="btn btn-secondary mt-3">Volver</a>
{% endblock %}
