{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda Gamer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'custom.css' %}">
</head>
<body>
<nav class="navbar navbar-dark px-3">
  <a class="navbar-brand" href="{% url 'lista' %}">
    <img src="{% static 'logo.svg' %}" height="32" alt="Logo"> Tienda Gamer
  </a>
  <div class="d-flex gap-2 align-items-center">
    {% if user.is_authenticated %}
      <span class="text-light">Hola, {{ user.username }}</span>
      <a class="btn btn-success btn-sm" href="{% url 'crear' %}">Nuevo juego</a>
      <form method="post" action="{% url 'logout' %}" class="m-0">
        {% csrf_token %}
        <button class="btn btn-outline-light btn-sm">Salir</button>
      </form>
    {% else %}
      <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Ingresar</a>
    {% endif %}
  </div>
</nav>

<div class="container mt-4">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
